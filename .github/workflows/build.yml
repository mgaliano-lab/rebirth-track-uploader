# Build de Rebirth Track Uploader en los runners del cluster Talos (x86, con Docker).
# - push/PR: compila, testea y arma el instalador SIN firmar (artefacto del job).
# - tag vX.Y.Z: igual pero FIRMADO (environment "release", con aprobación), crea el GitHub
#   Release y publica en el CDN (ast.rebirthknights.fun/uploader/) para la descarga desde la web.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: talos-lab-mgaliano-lab
    steps:
      - uses: actions/checkout@v4
      - name: Build (sin firma)
        run: |
          VERSION="0.0.0-dev.${GITHUB_SHA::7}"
          docker build --pull --build-arg VERSION="$VERSION" --target dist -o out .
      - uses: actions/upload-artifact@v4
        with:
          name: rebirth-track-uploader-dev
          path: out/
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: talos-lab-mgaliano-lab
    # Los secretos de firma viven solo en este environment (con revisor requerido).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build firmado
        env:
          SIGN_PROVIDER: ${{ secrets.SIGN_PROVIDER }}
          JSIGN_STORETYPE: ${{ secrets.JSIGN_STORETYPE }}
          JSIGN_KEYSTORE: ${{ secrets.JSIGN_KEYSTORE }}
          JSIGN_STOREPASS: ${{ secrets.JSIGN_STOREPASS }}
          JSIGN_ALIAS: ${{ secrets.JSIGN_ALIAS }}
          SIGN_COMMAND: ${{ secrets.SIGN_COMMAND }}
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING || '0' }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          umask 077
          {
            echo "SIGN_PROVIDER=${SIGN_PROVIDER}"
            echo "JSIGN_STORETYPE=${JSIGN_STORETYPE}"
            printf 'JSIGN_KEYSTORE=%q\n' "${JSIGN_KEYSTORE}"
            printf 'JSIGN_STOREPASS=%q\n' "${JSIGN_STOREPASS}"
            printf 'JSIGN_ALIAS=%q\n' "${JSIGN_ALIAS}"
            printf 'SIGN_COMMAND=%q\n' "${SIGN_COMMAND}"
          } > "$RUNNER_TEMP/sign.env"
          docker build --pull --build-arg VERSION="$VERSION" --build-arg REQUIRE_SIGNING="$REQUIRE_SIGNING" \
            --secret id=sign,src="$RUNNER_TEMP/sign.env" --target dist -o out .
          rm -f "$RUNNER_TEMP/sign.env"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --title "Rebirth Track Uploader $VERSION" \
            --notes "Instalador para Windows (x64). Verificá el archivo con SHA256SUMS.txt."
      - name: Publicar en el CDN
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CDN_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "Sin credenciales del CDN: no se publica en la web"; exit 0; fi
          docker run --rm -v "$PWD:/w" -w /w -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION=us-east-1 \
            --entrypoint bash amazon/aws-cli:2.27.0 scripts/publish-cdn.sh "$VERSION"
