# Build de Rebirth Track Uploader en runners de GitHub (gratis en repos públicos).
# Los PRs de forks corren en máquinas descartables de GitHub y no ven los secrets.
#  - build (Linux, Docker): tests + .exe + instalador NSIS.
#  - msix (Windows): tests en Windows (incluye DPAPI) + paquete MSIX para la Microsoft Store.
#  - release (tag vX.Y.Z, environment "release" con aprobación): GitHub Release con todo.
#  - store (solo tags estables): sube el MSIX a la Microsoft Store y lo manda a certificación.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${GITHUB_RUN_NUMBER}-dev.${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build (.exe + instalador)
        run: docker build --pull --build-arg VERSION="${{ steps.v.outputs.version }}" --target dist -o out .
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: out/
          retention-days: 14

  msix:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests en Windows
        run: go test ./...
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: out
      - name: Paquete MSIX
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        shell: pwsh
        run: |
          $v = "${{ needs.build.outputs.version }}"
          ./scripts/build-msix.ps1 -Exe "out/RebirthTrackUploader-$v.exe" -Version $v -Out msix-out
      - uses: actions/upload-artifact@v7
        with:
          name: msix
          path: msix-out/
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, msix]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd dist && sha256sum *.exe *.msix > SHA256SUMS.txt)
          # Un tag con sufijo (v0.2.0-beta.1) sale como pre-release: la actualización automática y el
          # sitio miran el último release estable, así que solo lo instala quien tenga el link.
          PRE=""; if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Rebirth Track Uploader $VERSION" $PRE \
            --notes "El MSIX es el que se publica en la Microsoft Store (firmado por Microsoft). El instalador .exe se incluye para revisión. Verificá los archivos con SHA256SUMS.txt."

  # Microsoft Store: sube el MSIX y lo manda a certificación (Microsoft lo revisa antes de
  # publicarlo). Solo tags estables: las betas (vX.Y.Z-beta.N) no van a la Store. Necesita la app
  # de Microsoft Entra de Partner Center en los secrets PARTNER_CENTER_*; sin ellos, se saltea.
  # Si todavía hay un envío en certificación, la Store no acepta otro: el job falla y se reintenta.
  store:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [msix, release]
    runs-on: windows-2025
    environment: release
    env:
      STORE_APP_ID: 9NHNP7JCN1BG
      TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
      SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
      CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
    steps:
      - name: ¿Hay credenciales?
        id: creds
        shell: pwsh
        run: |
          if ($env:TENANT_ID -and $env:SELLER_ID -and $env:CLIENT_ID -and $env:CLIENT_SECRET) { "ok=true" >> $env:GITHUB_OUTPUT }
          else { Write-Output "::notice::Sin secrets PARTNER_CENTER_*: no se sube a la Store (subilo a mano en Partner Center)." }
      - if: steps.creds.outputs.ok == 'true'
        uses: actions/download-artifact@v8
        with:
          name: msix
          path: msix
      - if: steps.creds.outputs.ok == 'true'
        uses: microsoft/setup-msstore-cli@v1.4
      - name: Subir a la Microsoft Store
        if: steps.creds.outputs.ok == 'true'
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          $pkg = (Get-ChildItem msix -Filter *.msix | Select-Object -First 1).FullName
          Write-Output "Subiendo $pkg"
          msstore publish $pkg --appId $env:STORE_APP_ID --output-stream stdout
